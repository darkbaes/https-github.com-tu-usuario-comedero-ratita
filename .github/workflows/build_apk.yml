name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK de Comedero Ratita
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK con Gradle
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Comedero-Ratita-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
