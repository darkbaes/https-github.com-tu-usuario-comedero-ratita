name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generar APK de Comedero Ratita
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar Entorno Android y Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Descargando Gradle 8.2..."
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d /tmp/
          chmod +x /tmp/gradle-8.2/bin/gradle

      - name: Compilar APK con Gradle
        run: |
          /tmp/gradle-8.2/bin/gradle assembleDebug --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk Comedero-Ratita.apk

      - name: Guardar log si hay error
        if: failure()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git checkout -B error-log
          tail -n 150 build.log > ERROR.txt || true
          git add ERROR.txt
          git commit -m "Registro de error en compilacion" || true
          git push origin error-log -f || true

      - name: Publicar APK en rama releases
        if: success()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git checkout -B releases
          git add -f Comedero-Ratita.apk
          git commit -m "APK Comedero Ratita compilado listo para descargar"
          git push origin releases -f

      - name: Subir APK como Artefacto descargable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Comedero-Ratita-APK
          path: Comedero-Ratita.apk
          if-no-files-found: error

      - name: Publicar Release directa con APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          name: "Comedero Ratita APK - Descarga Directa"
          body: |
            ### 🐹 Aplicación Android para Comedero de Hámster
            Descarga directa de **Comedero-Ratita.apk** para tu smartphone Android.
            
            **Novedades:**
            - 🕒 Botón para sincronizar la hora exacta de México (UTC-6) con el reloj RTC DS3231 del comedero.
            - 📶 Búsqueda y conexión a redes Wi-Fi guardadas en memoria Flash.
            - 🐾 Alimentación manual remota por Bluetooth y Wi-Fi.
            - ⏱️ Ajuste de temporizador de comida.
          files: Comedero-Ratita.apk
