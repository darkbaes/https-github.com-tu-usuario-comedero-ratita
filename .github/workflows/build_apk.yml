name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK de Comedero Ratita
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Compilar APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Comedero-Ratita-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Crear Release publica con el APK directo
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: Comedero Ratita v1.0.0 APK
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
